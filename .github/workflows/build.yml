name: Build Native Java APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compile and Sign Pure Java APK with Vector Icon
        run: |
          set -e
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)
          ANDROID_JAR="$PLATFORM/android.jar"

          mkdir -p src/com/rikosoft/posbridge res/drawable build/gen build/obj build/apk build/res
          cp BridgeApp.java src/com/rikosoft/posbridge/BridgeApp.java

          # 1. Генерируем нативную векторную иконку res/drawable/icon.xml
          cat << 'EOF' > res/drawable/icon.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="512"
              android:viewportHeight="512">
              <path android:pathData="M123,8 L389,8 A115,115 0 0,1 504,123 L504,389 A115,115 0 0,1 389,504 L123,504 A115,115 0 0,1 8,389 L8,123 A115,115 0 0,1 123,8 Z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="256"
                          android:startY="8"
                          android:endX="256"
                          android:endY="504"
                          android:type="linear">
                          <item android:offset="0.0" android:color="#FF05A8F7" />
                          <item android:offset="1.0" android:color="#FF0080DE" />
                      </gradient>
                  </aapt:attr>
              </path>
              <path
                  android:pathData="M 108 148 A 225 225 0 0 1 404 148 M 150 202 A 160 160 0 0 1 362 202 M 194 256 A 95 95 0 0 1 318 256"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="34"
                  android:strokeLineCap="round" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M 256,283 A 29,29 0 1,1 255.9,283 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M 140 388 H 210 V 402 H 183 V 474 H 167 V 402 H 140 Z M 287 444 L 303 448 C 299 459 292 466 283 470 C 274 475 264 476 252 475 C 237 475 225 470 218 461 C 211 452 207 441 207 429 C 207 416 211 405 218 397 C 226 389 238 385 253 385 C 266 385 277 388 285 394 C 292 399 298 406 301 415 L 285 419 C 282 411 278 406 272 403 C 267 399 260 398 253 398 C 242 398 234 401 229 407 C 225 413 223 420 223 429 C 223 439 225 447 230 453 C 235 459 243 462 253 462 C 261 462 268 460 274 457 C 280 453 284 449 287 444 Z M 316 474 V 388 H 356 C 367 388 375 390 381 395 C 387 400 390 407 390 416 C 390 425 387 432 381 437 C 375 442 367 445 355 445 H 332 V 474 Z M 332 431 H 355 C 362 431 367 430 370 427 C 373 424 374 421 374 416 C 374 411 373 408 370 405 C 367 402 362 401 355 401 H 332 Z" />
          </vector>
          EOF

          "$BUILD_TOOLS/aapt2" compile --dir res -o build/res/res.zip

          # 2. Упаковка AndroidManifest.xml и ресурсов в APK
          "$BUILD_TOOLS/aapt2" link -o build/apk/unsigned.apk \
            --manifest AndroidManifest.xml \
            -I "$ANDROID_JAR" \
            -R build/res/res.zip \
            --java build/gen

          # 3. Компиляция Java -> .class -> classes.dex
          javac -encoding UTF-8 --release 11 \
            -classpath "$ANDROID_JAR" \
            -d build/obj \
            src/com/rikosoft/posbridge/BridgeApp.java \
            $(find build/gen -name "*.java")

          "$BUILD_TOOLS/d8" $(find build/obj -name "*.class") \
            --lib "$ANDROID_JAR" \
            --min-api 24 \
            --output build/apk/

          # 4. Добавление classes.dex в APK и выравнивание
          cd build/apk && zip -q -u unsigned.apk classes.dex && cd ../..
          "$BUILD_TOOLS/zipalign" -f -p 4 build/apk/unsigned.apk build/apk/aligned.apk

          # 5. Проверка/создание постоянного ключа pos-bridge.jks
          if [ ! -f pos-bridge.jks ]; then
            keytool -genkeypair -v -keystore pos-bridge.jks -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 -alias posbridge \
              -storepass rikoriko -keypass rikoriko \
              -dname "CN=POSBridge, OU=Dev, O=RikoSoft, L=Valencia, S=Valencia, C=ES"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add pos-bridge.jks
            git commit -m "Save persistent keystore" || true
            git push || true
          fi

          # 6. Подпись APK
          "$BUILD_TOOLS/apksigner" sign \
            --ks pos-bridge.jks \
            --ks-key-alias posbridge \
            --ks-pass pass:rikoriko \
            --key-pass pass:rikoriko \
            --out tcp-bridge.apk \
            build/apk/aligned.apk

          ls -lh tcp-bridge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tcp-bridge
          path: tcp-bridge.apk
